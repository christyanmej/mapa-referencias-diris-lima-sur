<head>
  <meta charset="utf-8" />

  <title>Buscador de EESS y Rutas - DIRIS Lima Sur</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <!-- Turf.js para análisis espacial -->

  <style>
    body { margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    #map { width: 100vw; height: 100vh; }
    
    /* Botón flotante para GPS */
    .btn-gps {
      position: absolute;
      top: 15px;
      right: 15px;
      z-index: 1000;
      background: #007bff;
      color: white;
      border: none;
      padding: 12px 18px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      font-size: 14px;
      box-shadow: 0 3px 6px rgba(0,0,0,0.3);
      transition: background 0.2s, transform 0.1s;
    }
    .btn-gps:hover { background: #0056b3; }
    .btn-gps:active { transform: scale(0.98); }

    /* Estilos para el Popup */
    .popup-eess { font-size: 13px; line-height: 1.5; color: #333; }
    .popup-eess b { color: #0056b3; }
    .badge {
      display: inline-block;
      padding: 3px 8px;
      font-size: 11px;
      font-weight: bold;
      color: white;
      border-radius: 4px;
      margin-top: 4px;
    }
    .badge-uviclin { background-color: #007bff; }
    .badge-febril { background-color: #dc3545; }
    .badge-default { background-color: #6c757d; }

    /* Leyenda flotante en el mapa */
    .legend {
      position: absolute;
      bottom: 25px;
      left: 15px;
      z-index: 1000;
      background: rgba(255, 255, 255, 0.95);
      padding: 10px 14px;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.25);
      font-size: 12px;
      line-height: 1.8;
    }
    .legend-title { font-weight: bold; margin-bottom: 4px; color: #222; }
    .legend-item { display: flex; align-items: center; gap: 8px; }
    .legend-item img { width: 20px; height: 20px; object-fit: contain; }
  </style>
</head>

        {"type":"Feature","id":138,"geometry":{"type":"Point","coordinates":[-8561531.2752,-1372601.804299999]},"properties":{"OBJECTID":138,"Código_Único":"00006082","Distrito":"LURIN","Categoria":"I-3","POINT_Y":-12.23620399999993,"DIRECCION":"MZ L- LOTE 31- I Etapa AAHH VILLA ALEJANDRO , LURIN","NOM_EESS_RECOR":"C.S. VILLA ALEJANDRO","AMBULANCIAS":null,"tipo_atencion":"UNIDAD FEBRIL","estado_uviclin":"ACTIVO","camas_totales":0,"camas_ocupadas":0,"camas_disponibles":0,"porc_ocupacion":0,"camas_mosquiteros":0,"camillas_totales":1,"camillas_ocupadas":0,"camillas_disponibles":1,"porc_ocup_camill":0,"camillas_mosquiteros":1,"rrhh":null}},
        {"type":"Feature","id":140,"geometry":{"type":"Point","coordinates":[-8548901.2184999995,-1387087.5223999992]},"properties":{"OBJECTID":140,"Código_Único":"00006087","Distrito":"PUNTA NEGRA","Categoria":"I-3","POINT_Y":-12.363344499999926,"DIRECCION":"Av. Guayanay norte - zona central mz h-1 lt 6 punta negra","NOM_EESS_RECOR":"C.S. PUNTA NEGRA","AMBULANCIAS":null,"tipo_atencion":"UNIDAD FEBRIL","estado_uviclin":"ACTIVO","camas_totales":0,"camas_ocupadas":0,"camas_disponibles":0,"porc_ocupacion":0,"camas_mosquiteros":0,"camillas_totales":2,"camillas_ocupadas":0,"camillas_disponibles":2,"porc_ocup_camill":0,"camillas_mosquiteros":2,"rrhh":null}}
      ]
    };

    // 2. Inicializar mapa centrado en Lima Sur
    const map = L.map('map').setView([-12.203, -76.973], 12);

    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}', {
      maxZoom: 18,
      attribution: 'Tiles © Esri'
    }).addTo(map);

    let eessGeoJSON = null;
    let userMarker = null;
    let rutaLayer = null;

    // 3. Iconos personalizados consumiendo archivos png locales de GitHub
    const iconUviclin = L.icon({
      iconUrl: 'uviclin.png',
      shadowUrl: 'https://unpkg.com/leaflet@1.9.4/dist/images/marker-shadow.png',
      iconSize: [32, 32],
      iconAnchor: [16, 32],
      popupAnchor: [0, -30]
    });

    const iconFebril = L.icon({
      iconUrl: 'febril.png',
      shadowUrl: 'https://unpkg.com/leaflet@1.9.4/dist/images/marker-shadow.png',
      iconSize: [32, 32],
      iconAnchor: [16, 32],
      popupAnchor: [0, -30]
    });

    const iconDefault = L.icon({
      iconUrl: 'https://unpkg.com/leaflet@1.9.4/dist/images/marker-icon.png',
      shadowUrl: 'https://unpkg.com/leaflet@1.9.4/dist/images/marker-shadow.png',
      iconSize: [25, 41],
      iconAnchor: [12, 41],
      popupAnchor: [1, -34]
    });

    // Conversión matemática de Web Mercator (EPSG:3857) a WGS84 (EPSG:4326)
    function webMercatorToWGS84(x, y) {
      const lng = (x / 6378137.0) * (180 / Math.PI);
      const lat = (Math.atan(Math.exp(y / 6378137.0)) - (Math.PI / 4)) * 2 * (180 / Math.PI);
      return [lng, lat];
    }

    // Procesar coordenadas a WGS84
    const featuresConvertidos = rawData.features.map(f => {
      const coordsWGS84 = webMercatorToWGS84(f.geometry.coordinates[0], f.geometry.coordinates[1]);
      return turf.point(coordsWGS84, f.properties);
    });

    eessGeoJSON = turf.featureCollection(featuresConvertidos);

    // 4. Cargar capa en el mapa con simbología por tipo de atención
    L.geoJSON(eessGeoJSON, {
      pointToLayer: function (feature, latlng) {
        const tipo = feature.properties.tipo_atencion;
        if (tipo === "UVICLIN") return L.marker(latlng, { icon: iconUviclin });
        if (tipo === "UNIDAD FEBRIL") return L.marker(latlng, { icon: iconFebril });
        return L.marker(latlng, { icon: iconDefault });
      },
      onEachFeature: (feature, layer) => {
        const p = feature.properties;
        let badgeClass = 'badge badge-default';
        if (p.tipo_atencion === "UVICLIN") badgeClass = 'badge badge-uviclin';
        if (p.tipo_atencion === "UNIDAD FEBRIL") badgeClass = 'badge badge-febril';

        const popupContent = `
          <div class="popup-eess">
            <b>${p.NOM_EESS_RECOR}</b><br>
            <span class="${badgeClass}">${p.tipo_atencion || 'EESS'} - Cat. ${p.Categoria}</span><br>
            <b>Distrito:</b> ${p.Distrito}<br>
            <b>Dirección:</b> ${p.DIRECCION}<br>
            <b>Camas Disponibles:</b> ${p.camas_disponibles || 0}<br>
            <b>Camillas Disponibles:</b> ${p.camillas_disponibles || 0}
          </div>
        `;
        layer.bindPopup(popupContent);
      }
    }).addTo(map);

    // 5. Geolocalización por GPS
    function obtenerUbicacionGPS() {
      if (!navigator.geolocation) {
        alert("Tu dispositivo o navegador no soporta geolocalización por GPS.");
        return;
      }

      navigator.geolocation.getCurrentPosition(
        (pos) => {
          const userLat = pos.coords.latitude;
          const userLng = pos.coords.longitude;
          const userLngLat = [userLng, userLat];

          if (userMarker) map.removeLayer(userMarker);
          userMarker = L.marker([userLat, userLng], {
            icon: L.divIcon({
              className: 'user-icon',
              html: '<div style="background-color:#d9534f; width:16px; height:16px; border-radius:50%; border:3px solid white; box-shadow:0 0 6px rgba(0,0,0,0.5);"></div>'
            })
          }).addTo(map).bindPopup("<b>Tu Ubicación Actual</b>").openPopup();

          map.setView([userLat, userLng], 14);

          if (eessGeoJSON) {
            calcularRutaEESSMasCercano(userLngLat);
          }
        },
        (error) => alert("Error al obtener GPS: " + error.message),
        { enableHighAccuracy: true }
      );
    }

    // 6. Cálculo de EESS más cercano y trazo de ruta con OSRM
    function calcularRutaEESSMasCercano(userLngLat) {
      const origenTurf = turf.point(userLngLat);
      const masCercano = turf.nearestPoint(origenTurf, eessGeoJSON);
      const destinoCoords = masCercano.geometry.coordinates;
      const p = masCercano.properties;

      const url = `https://router.project-osrm.org/route/v1/driving/${userLngLat[0]},${userLngLat[1]};${destinoCoords[0]},${destinoCoords[1]}?overview=full&geometries=geojson`;

      fetch(url)
        .then(res => res.json())
        .then(data => {
          if (data.routes && data.routes.length > 0) {
            if (rutaLayer) map.removeLayer(rutaLayer);

            const geometry = data.routes[0].geometry;
            const duracionMin = Math.round(data.routes[0].duration / 60);
            const distanciaKm = (data.routes[0].distance / 1000).toFixed(2);

            rutaLayer = L.geoJSON(geometry, { style: { color: '#0055ff', weight: 6, opacity: 0.85 } }).addTo(map);

            let badgeClass = 'badge badge-default';
            if (p.tipo_atencion === "UVICLIN") badgeClass = 'badge badge-uviclin';
            if (p.tipo_atencion === "UNIDAD FEBRIL") badgeClass = 'badge badge-febril';

            L.popup()
              .setLatLng([destinoCoords[1], destinoCoords[0]])
              .setContent(`
                <div class="popup-eess">
                  <b>EESS Más Cercano:</b> ${p.NOM_EESS_RECOR}<br>
                  <span class="${badgeClass}">${p.tipo_atencion || 'EESS'} - Cat. ${p.Categoria}</span><br>
                  <b>Dirección:</b> ${p.DIRECCION}<hr>
                  <b>Distancia vial:</b> ${distanciaKm} km<br>
                  <b>Tiempo estimado:</b> ${duracionMin} minutos
                </div>
              `)
              .openOn(map);
          }
        });
    }
  </script>
